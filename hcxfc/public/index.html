<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>校服之家 - 商家自助开店</title>
<style>
  :root{
    --primary:#c1592f;
    --primary-dark:#9e4524;
    --primary-tint:#f3e3d6;
    --bg:#f8f1e6;
    --card:#ffffff;
    --text:#2b231c;
    --muted:#8a7a68;
    --border:#ebdcc8;
    --navy:#27415f;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
  header{background:linear-gradient(135deg,var(--navy),#3a5a82);color:#fff;padding:46px 20px 60px;text-align:center;}
  header h1{margin:0 0 8px;font-size:24px;letter-spacing:1px;}
  header p{margin:0;font-size:13.5px;opacity:.88;}
  .container{max-width:420px;margin:-30px auto 0;padding:0 20px 50px;}
  .card{background:var(--card);border-radius:16px;box-shadow:0 10px 30px rgba(158,69,36,.12);padding:26px 22px;}
  .plan{background:var(--primary-tint);color:var(--primary-dark);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.7;margin-bottom:18px;}
  .plan b{color:var(--primary-dark);}
  label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px;}
  input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;font-size:15px;outline:none;}
  input:focus{border-color:var(--primary);}
  .btn{width:100%;padding:13px 0;background:var(--primary);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;margin-top:20px;cursor:pointer;}
  .btn:active{background:var(--primary-dark);}
  .msg{font-size:13px;color:#c0392b;margin-top:10px;min-height:18px;}
  .login-link{display:block;text-align:center;margin-top:16px;font-size:13px;color:var(--muted);text-decoration:none;}
  .login-link b{color:var(--primary);}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:0 20px 20px;}
</style>
</head>
<body>
<header>
  <h1>校服之家</h1>
  <p>商家自助开店 · 独立店铺 · 微信/电话直连家长</p>
</header>

<div class="container">
  <div class="card">
    <div class="plan">
      <b>免费搭建3天</b> → 满意后付<b>20元开通2周试用</b> → 到期可<b>正式开通</b>或<b>注销</b>（注销后数据保留1个月）
    </div>

    <label>手机号</label>
    <input id="phone" type="tel" placeholder="请输入手机号" maxlength="11">

    <label>店铺名称</label>
    <input id="shopName" type="text" placeholder="例如：小张校服店" maxlength="30">

    <label>设置密码</label>
    <input id="password" type="password" placeholder="至少6位，用于登录后台" maxlength="30">

    <button class="btn" onclick="doRegister()">免费注册开店</button>
    <div class="msg" id="msg"></div>

    <a class="login-link" href="/merchant_login.html">已有店铺？<b>点此登录</b></a>
  </div>
</div>

<footer>每家店铺都是独立入口，平台不汇总展示商家，避免同校比价竞争 · 校服之家</footer>

<script>
async function doRegister(){
  const phone = document.getElementById('phone').value.trim();
  const password = document.getElementById('password').value;
  const shopName = document.getElementById('shopName').value.trim();
  const msg = document.getElementById('msg');
  msg.textContent = '';
  if(!/^1[3-9]\d{9}$/.test(phone)){ msg.textContent = '手机号格式不对'; return; }
  if(password.length < 6){ msg.textContent = '密码至少6位'; return; }
  try{
    const r = await fetch('/api/register', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({phone, password, shopName})});
    const d = await r.json();
    if(!d.ok){ msg.textContent = d.msg || '注册失败'; return; }
    localStorage.setItem('hcxfc_token', d.token);
    localStorage.setItem('hcxfc_role', 'merchant');
    location.href = '/merchant_admin.html';
  }catch(e){
    msg.textContent = '网络错误，请重试';
  }
}
document.getElementById('password').addEventListener('keydown', e => { if(e.key==='Enter') doRegister(); });
</script>
<div style="text-align:center;color:#8a7a68;font-size:11.5px;padding:10px 16px 30px;line-height:1.8;">冀ICP备2026012724号<br>技术支持/开店咨询 微信：907029936</div>
</body>
</html>
