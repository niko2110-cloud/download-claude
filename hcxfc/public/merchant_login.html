<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>商家登录 - 校服之家</title>
<style>
  :root{--primary:#c1592f;--primary-dark:#9e4524;--bg:#f8f1e6;--card:#fff;--text:#2b231c;--muted:#8a7a68;--border:#ebdcc8;--navy:#27415f;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
  .wrap{max-width:400px;margin:0 auto;padding:50px 20px;}
  .logo{text-align:center;margin-bottom:30px;}
  .logo h1{font-size:22px;margin:0 0 6px;color:var(--primary);}
  .logo p{margin:0;font-size:13px;color:var(--muted);}
  .card{background:var(--card);border-radius:14px;padding:24px;box-shadow:0 4px 20px rgba(158,69,36,.1);}
  .switch{display:flex;background:#f1ece6;border-radius:10px;margin-bottom:20px;padding:4px;}
  .switch div{flex:1;text-align:center;padding:9px 0;border-radius:8px;font-size:14px;color:var(--muted);cursor:pointer;}
  .switch div.active{background:#fff;color:var(--primary);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.08);}
  label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px;}
  input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;font-size:15px;outline:none;}
  input:focus{border-color:var(--primary);}
  .btn{width:100%;padding:13px 0;background:var(--primary);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;margin-top:20px;cursor:pointer;}
  .msg{font-size:13px;color:#e4572e;margin-top:10px;min-height:18px;}
  .back-home{display:block;text-align:center;margin-top:16px;font-size:13px;color:var(--muted);text-decoration:none;}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <h1>校服之家</h1>
    <p>商家后台</p>
  </div>
  <div class="card">
    <div class="switch">
      <div id="tabLogin" class="active">登录</div>
      <div id="tabRegister">注册开店</div>
    </div>

    <div id="formArea">
      <label>手机号</label>
      <input id="phone" type="tel" placeholder="请输入手机号" maxlength="11">

      <div id="shopNameField" style="display:none;">
        <label>店铺名称</label>
        <input id="shopName" type="text" placeholder="例如：小张校服店" maxlength="30">
      </div>

      <label>密码</label>
      <input id="password" type="password" placeholder="至少6位" maxlength="30">

      <button class="btn" id="submitBtn" onclick="doLogin()">登录</button>
      <div class="msg" id="msg"></div>
    </div>
  </div>
  <a class="back-home" href="/">← 返回首页</a>
</div>

<script>
let mode = 'login';

document.getElementById('tabLogin').addEventListener('click', () => switchMode('login'));
document.getElementById('tabRegister').addEventListener('click', () => switchMode('register'));

function switchMode(m){
  mode = m;
  document.getElementById('tabLogin').classList.toggle('active', m==='login');
  document.getElementById('tabRegister').classList.toggle('active', m==='register');
  document.getElementById('shopNameField').style.display = m==='register' ? 'block' : 'none';
  document.getElementById('submitBtn').textContent = m==='register' ? '注册并开店' : '登录';
  document.getElementById('submitBtn').onclick = m==='register' ? doRegister : doLogin;
  document.getElementById('msg').textContent = '';
}

async function doLogin(){
  const phone = document.getElementById('phone').value.trim();
  const password = document.getElementById('password').value;
  const msg = document.getElementById('msg');
  msg.textContent = '';
  if(!phone || !password){ msg.textContent = '请输入手机号和密码'; return; }
  try{
    const r = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({phone, password})});
    const d = await r.json();
    if(!d.ok){ msg.textContent = d.msg || '登录失败'; return; }
    localStorage.setItem('hcxfc_token', d.token);
    localStorage.setItem('hcxfc_role', d.role);
    location.href = d.role === 'admin' ? '/admin.html' : '/merchant_admin.html';
  }catch(e){
    msg.textContent = '网络错误，请重试';
  }
}

async function doRegister(){
  const phone = document.getElementById('phone').value.trim();
  const password = document.getElementById('password').value;
  const shopName = document.getElementById('shopName').value.trim();
  const msg = document.getElementById('msg');
  msg.textContent = '';
  if(!/^1[3-9]\d{9}$/.test(phone)){ msg.textContent = '手机号格式不对'; return; }
  if(password.length < 6){ msg.textContent = '密码至少6位'; return; }
  try{
    const r = await fetch('/api/register', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({phone, password, shopName})});
    const d = await r.json();
    if(!d.ok){ msg.textContent = d.msg || '注册失败'; return; }
    localStorage.setItem('hcxfc_token', d.token);
    localStorage.setItem('hcxfc_role', 'merchant');
    location.href = '/merchant_admin.html';
  }catch(e){
    msg.textContent = '网络错误，请重试';
  }
}

document.getElementById('password').addEventListener('keydown', e => { if(e.key==='Enter') (mode==='login'?doLogin:doRegister)(); });
</script>
</body>
</html>
