<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>商品详情 - 校服之家</title>
<style>
  :root{--primary:#c1592f;--primary-dark:#9e4524;--primary-tint:#f3e3d6;--bg:#f8f1e6;--card:#fff;--text:#2b231c;--muted:#8a7a68;--border:#ebdcc8;--price:#9e4524;--navy:#27415f;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);padding-bottom:84px;}
  .topbar{background:#fff;border-bottom:1px solid var(--border);padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;}
  .back{color:var(--muted);text-decoration:none;font-size:20px;line-height:1;}
  .topbar h1{font-size:15px;margin:0;font-weight:600;flex:1;}
  .share-link{color:var(--primary);text-decoration:none;font-size:12.5px;white-space:nowrap;display:flex;align-items:center;gap:3px;}
  .share-toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;font-size:13px;padding:9px 18px;border-radius:20px;z-index:50;display:none;max-width:85vw;text-align:center;}

  .gallery{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;background:#f1ece6;}
  .gallery img{width:100%;aspect-ratio:1/1;object-fit:cover;flex-shrink:0;scroll-snap-align:start;}
  .gallery.empty{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;color:#d8cfc3;font-size:60px;}
  .dots{display:flex;justify-content:center;gap:5px;padding:8px 0;background:#f1ece6;}
  .dot{width:5px;height:5px;border-radius:50%;background:#d8cfc3;}
  .dot.active{background:var(--primary);width:14px;border-radius:3px;}

  .container{max-width:560px;margin:0 auto;padding:16px;}
  .main-card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:12px;}
  .name{font-size:17px;font-weight:700;margin:0 0 8px;}
  .price{font-size:22px;color:var(--price);font-weight:800;margin-bottom:10px;}
  .tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
  .tag{background:var(--primary-tint);color:var(--primary-dark);font-size:12px;padding:4px 10px;border-radius:20px;}
  .desc{font-size:13.5px;color:var(--muted);line-height:1.6;white-space:pre-wrap;}
  .size-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px;}
  .size-chip{border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:13px;color:var(--text);}
  .shop-card{background:var(--card);border-radius:12px;padding:16px;display:flex;align-items:center;gap:10px;}
  .shop-card .avatar{width:40px;height:40px;border-radius:10px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex-shrink:0;}
  .shop-card .shopname{font-size:14px;font-weight:600;}
  .shop-card .link{margin-left:auto;font-size:12px;color:var(--primary);text-decoration:none;}
  .section-label{font-size:12px;color:var(--muted);margin:0 0 8px;font-weight:600;}
  .bottom-bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--border);padding:10px 16px;display:flex;gap:10px;max-width:560px;margin:0 auto;}
  .btn{flex:1;text-align:center;padding:13px 0;border-radius:10px;font-size:14px;font-weight:600;text-decoration:none;border:none;}
  .btn-wechat{background:#07c160;color:#fff;}
  .btn-phone{background:var(--primary);color:#fff;}
  .empty{text-align:center;color:var(--muted);padding:60px 20px;}
  .contact-modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;align-items:flex-end;}
  .contact-modal-bg.show{display:flex;}
  .contact-modal{background:#fff;border-radius:16px 16px 0 0;padding:20px 20px 28px;width:100%;max-width:560px;margin:0 auto;}
  .contact-modal h3{margin:0 0 12px;font-size:15px;}
  .contact-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px;}
  .copy-btn{font-size:12px;color:var(--primary);border:1px solid var(--primary);border-radius:6px;padding:4px 10px;background:none;text-decoration:none;}
  .close-modal{display:block;width:100%;text-align:center;margin-top:14px;color:var(--muted);font-size:13px;background:none;border:none;padding:8px;}
  .ship-note{background:var(--primary-tint);color:var(--primary-dark);font-size:12.5px;padding:8px 10px;border-radius:8px;margin-top:10px;}
  .bottom-bar.has3 .btn{font-size:12.5px;padding:13px 2px;}
  .order-modal label{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 5px;}
  .order-modal input,.order-modal textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;outline:none;font-family:inherit;box-sizing:border-box;}
  .order-modal textarea{resize:vertical;min-height:50px;}
  .size-pick{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
  .size-pick .chip{border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;}
  .size-pick .chip.active{background:var(--primary);color:#fff;border-color:var(--primary);}
  .shot-upload{width:100px;height:100px;border:1px dashed var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;cursor:pointer;margin-top:6px;background:#f1ece6 center/cover no-repeat;position:relative;overflow:hidden;text-align:center;}
  .order-msg{font-size:12.5px;color:#e4572e;margin-top:10px;min-height:16px;}
</style>
</head>
<body>
<div class="topbar">
  <a class="back" href="javascript:history.back()">←</a>
  <h1>商品详情</h1>
  <a class="share-link" href="javascript:void(0)" onclick="shareProduct()">📤 分享</a>
</div>

<div id="content"></div>
<div class="share-toast" id="shareToast"></div>

<script>
const params = new URLSearchParams(location.search);
const shopId = params.get('shop');
const id = params.get('id');

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

let productForShare = null;

function showToast(msg){
  const t = document.getElementById('shareToast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => { t.style.display = 'none'; }, 2200);
}

async function shareProduct(){
  const url = location.href;
  const name = productForShare ? productForShare.name : '这件校服';
  const price = productForShare && productForShare.price ? ('¥' + productForShare.price) : '';
  const title = name + ' - 校服之家';
  const text = name + (price ? '（' + price + '）' : '') + '，点进来看看';
  if(navigator.share){
    try{ await navigator.share({ title, text, url }); return; }catch(e){ /* 取消或不支持，走复制兜底 */ }
  }
  try{
    await navigator.clipboard.writeText(url);
    showToast('链接已复制，发到微信群/朋友圈即可');
  }catch(e){
    showToast(url);
  }
}

async function load(){
  const content = document.getElementById('content');
  if(!shopId || !id){
    content.innerHTML = '<div class="empty">商品链接不对</div>';
    return;
  }
  try{
    const r = await fetch('/api/product/' + encodeURIComponent(shopId) + '/' + encodeURIComponent(id));
    const d = await r.json();
    if(!d.ok){ content.innerHTML = '<div class="empty">' + escapeHtml(d.msg || '商品不存在或已下架') + '</div>'; return; }
    render(d.product);
  }catch(e){
    content.innerHTML = '<div class="empty">加载失败，请重试</div>';
  }
}

function render(p){
  document.title = p.name + ' - 校服之家';
  productForShare = p;
  const content = document.getElementById('content');
  const imgs = (p.images && p.images.length) ? p.images : [];
  const gallery = imgs.length
    ? `<div class="gallery" id="gallery">${imgs.map(img => `<img src="${img}">`).join('')}</div>
       ${imgs.length > 1 ? `<div class="dots">${imgs.map((_,i) => `<div class="dot ${i===0?'active':''}"></div>`).join('')}</div>` : ''}`
    : `<div class="gallery empty">👕</div>`;

  content.innerHTML = `
    ${gallery}
    <div class="container">
      <div class="main-card">
        <div class="name">${escapeHtml(p.name)}</div>
        <div class="price">${p.price ? '¥' + escapeHtml(p.price) : '价格面议'}</div>
        <div class="tag-row">
          <span class="tag">${escapeHtml(p.school)}</span>
          <span class="tag">${escapeHtml(p.season)}</span>
          ${p.category ? `<span class="tag">${escapeHtml(p.category)}</span>` : ''}
        </div>
        ${p.sizes && p.sizes.length ? `
          <div class="section-label">可选尺码</div>
          <div class="size-row">${p.sizes.map(s => `<span class="size-chip">${escapeHtml(s)}</span>`).join('')}</div>
        ` : ''}
        ${p.desc ? `<div class="section-label" style="margin-top:10px;">商品说明</div><div class="desc">${escapeHtml(p.desc)}</div>` : ''}
        ${p.shipping ? `<div class="ship-note">📦 支持邮寄${p.shippingNote ? '：' + escapeHtml(p.shippingNote) : ''}</div>` : ''}
      </div>
      <div class="shop-card">
        ${p.shopLogo ? `<img class="avatar" src="${p.shopLogo}" style="object-fit:cover;">` : `<div class="avatar">${escapeHtml((p.shopName||'店').slice(0,1))}</div>`}
        <div class="shopname">${escapeHtml(p.shopName)}</div>
        <a class="link" href="/shop.html?shop=${encodeURIComponent(p.shopId)}">查看店铺 ›</a>
      </div>
    </div>
    <div class="bottom-bar ${p.shipping ? 'has3' : ''}">
      <button class="btn btn-wechat" onclick="openContact()">微信联系</button>
      <button class="btn btn-phone" onclick="openContact()">电话联系</button>
      ${p.shipping ? `<button class="btn" style="background:var(--navy);color:#fff;" onclick="openOrderModal()">微信付款·寄件下单</button>` : ''}
    </div>
    <div class="contact-modal-bg" id="modalBg" onclick="closeModal(event)">
      <div class="contact-modal">
        <h3>联系商家 · ${escapeHtml(p.shopName)}</h3>
        ${p.contactWechat ? `<div class="contact-item"><span>微信号：${escapeHtml(p.contactWechat)}</span><button class="copy-btn" onclick="copyText('${escapeHtml(p.contactWechat)}')">复制</button></div>` : ''}
        ${p.contactPhone ? `<div class="contact-item"><span>电话：${escapeHtml(p.contactPhone)}</span><a class="copy-btn" href="tel:${escapeHtml(p.contactPhone)}">拨打</a></div>` : ''}
        ${(!p.contactWechat && !p.contactPhone) ? `<div class="contact-item" style="border-bottom:none;color:#6b7280;">商家暂未留下联系方式</div>` : ''}
        <button class="close-modal" onclick="closeModal()">关闭</button>
      </div>
    </div>
    <div class="contact-modal-bg" id="orderModalBg" onclick="closeOrderModal(event)">
      <div class="contact-modal order-modal">
        <h3>微信付款 · 寄件下单</h3>
        <div style="font-size:12.5px;color:var(--muted);line-height:1.6;">
          不支持在线支付，流程是：加商家微信转账 → 截图上传到这里 → 留好收货地址 → 商家核实到账后给你发货。
        </div>
        ${p.contactWechat ? `<div class="contact-item"><span>商家微信号：${escapeHtml(p.contactWechat)}</span><button class="copy-btn" onclick="copyText('${escapeHtml(p.contactWechat)}')">复制</button></div>` : ''}

        ${p.sizes && p.sizes.length ? `
          <label>选择尺码</label>
          <div class="size-pick" id="orderSizePick">
            ${p.sizes.map(s => `<div class="chip" onclick="pickOrderSize(this,'${escapeHtml(s).replace(/'/g,"\\'")}')">${escapeHtml(s)}</div>`).join('')}
          </div>
        ` : ''}

        <label>联系方式（手机号/微信号，商家靠这个联系你）</label>
        <input id="orderPhone" type="text" placeholder="请输入手机号或微信号" maxlength="30">

        <label>收货地址</label>
        <textarea id="orderAddress" placeholder="省市区 + 详细地址 + 收件人姓名" maxlength="200"></textarea>

        <label>备注（可不填）</label>
        <input id="orderNote" type="text" placeholder="有其他要求可以写在这里" maxlength="200">

        <label>上传微信付款截图</label>
        <div class="shot-upload" id="shotUpload" onclick="document.getElementById('shotInput').click()">点击上传截图</div>
        <input type="file" id="shotInput" accept="image/*" style="display:none" onchange="uploadShot(event)">

        <div class="order-msg" id="orderMsg"></div>
        <div class="modal-actions" style="display:flex;gap:10px;margin-top:14px;">
          <button class="close-modal" style="flex:1;border:1px solid var(--border);border-radius:8px;" onclick="closeOrderModal()">取消</button>
          <button class="btn" style="flex:1;" onclick="submitOrder()">提交订单</button>
        </div>
      </div>
    </div>
  `;

  const gal = document.getElementById('gallery');
  if(gal){
    gal.addEventListener('scroll', () => {
      const idx = Math.round(gal.scrollLeft / gal.clientWidth);
      document.querySelectorAll('.dot').forEach((d,i) => d.classList.toggle('active', i===idx));
    });
  }
}

function openContact(){
  document.getElementById('modalBg').classList.add('show');
}
function closeModal(e){
  if(e && e.target.id !== 'modalBg') return;
  document.getElementById('modalBg').classList.remove('show');
}

// ---- 微信付款·寄件下单 ----
let orderSize = '';
let orderScreenshot = '';

function openOrderModal(){
  orderSize = '';
  orderScreenshot = '';
  document.getElementById('orderModalBg').classList.add('show');
}
function closeOrderModal(e){
  if(e && e.target.id !== 'orderModalBg') return;
  document.getElementById('orderModalBg').classList.remove('show');
}
function pickOrderSize(el, s){
  orderSize = s;
  document.querySelectorAll('#orderSizePick .chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
}
async function uploadShot(e){
  const file = e.target.files[0];
  if(!file) return;
  const fd = new FormData();
  fd.append('file', file);
  const msg = document.getElementById('orderMsg');
  msg.style.color = 'var(--muted)';
  msg.textContent = '上传中...';
  try{
    const r = await fetch('/api/public-upload', {method:'POST', body: fd});
    const d = await r.json();
    if(d.ok){
      orderScreenshot = d.url;
      document.getElementById('shotUpload').style.backgroundImage = `url('${d.url}')`;
      document.getElementById('shotUpload').textContent = '';
      msg.textContent = '截图已上传';
      msg.style.color = '#07c160';
    }else{
      msg.textContent = d.msg || '上传失败';
      msg.style.color = '#e4572e';
    }
  }catch(err){
    msg.textContent = '上传失败，请重试';
    msg.style.color = '#e4572e';
  }
  e.target.value = '';
}
async function submitOrder(){
  const phone = document.getElementById('orderPhone').value.trim();
  const address = document.getElementById('orderAddress').value.trim();
  const note = document.getElementById('orderNote').value.trim();
  const msg = document.getElementById('orderMsg');
  if(!phone){ msg.textContent = '请留下联系方式'; msg.style.color = '#e4572e'; return; }
  if(!address){ msg.textContent = '请填写收货地址'; msg.style.color = '#e4572e'; return; }
  if(!orderScreenshot){ msg.textContent = '请先上传微信付款截图'; msg.style.color = '#e4572e'; return; }
  try{
    const r = await fetch('/api/order', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ shopId, productId: id, size: orderSize, contactPhone: phone, address, note, screenshot: orderScreenshot })
    });
    const d = await r.json();
    if(d.ok){
      msg.style.color = '#07c160';
      msg.textContent = '提交成功，商家核实到账后会联系你发货';
      setTimeout(() => closeOrderModal(), 1500);
    }else{
      msg.textContent = d.msg || '提交失败';
      msg.style.color = '#e4572e';
    }
  }catch(err){
    msg.textContent = '网络错误，请重试';
    msg.style.color = '#e4572e';
  }
}
function copyText(t){
  navigator.clipboard && navigator.clipboard.writeText(t).then(()=>alert('已复制：' + t)).catch(()=>alert('复制失败，请手动复制：' + t));
}

load();
</script>
<div style="text-align:center;color:#8a7a68;font-size:11.5px;padding:10px 16px 30px;line-height:1.8;">冀ICP备2026012724号<br>技术支持/开店咨询 微信：907029936</div>
</body>
</html>
